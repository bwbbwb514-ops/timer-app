<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ola timer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap');

  :root{
    --cream: #FFF6EC;
    --cream-2: #FCEAD9;
    --peach-1: #FFD9B8;
    --peach-2: #FFAE85;
    --peach-3: #FF8A63;
    --peach-deep: #E5623F;
    --pit: #7A3B2E;
    --pit-soft: #9C5745;
    --leaf: #6E8F5C;
    --leaf-dark: #4F6B41;
    --rain: #AFC9CE;
    --rain-soft: #D7E6E8;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 30% 15%, var(--cream-2), var(--cream) 60%);
    font-family:'Cairo', sans-serif;
    color: var(--pit);
    overflow:hidden;
    position:relative;
  }

  #rain-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    opacity:0;
    transition: opacity 1s ease;
    z-index:1;
  }
  #rain-canvas.active{ opacity:0.55; }

  .stage{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    padding:36px 28px 40px;
  }

  .wordmark{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:0.5px;
    color: var(--pit-soft);
  }
  .wordmark svg{ width:22px; height:22px; }

  .peach-wrap{
    position:relative;
    width:280px;
    height:280px;
    filter: drop-shadow(0 18px 30px rgba(229,98,63,0.28));
  }

  .peach-svg{ width:100%; height:100%; display:block; }

  .juice-mask-fill{
    transition: transform 0.5s linear;
  }

  .peach-outline{
    fill:none;
    stroke: var(--peach-deep);
    stroke-width:2.5;
    opacity:0.35;
  }

  .drip{
    position:absolute;
    top:8%;
    left:50%;
    transform:translateX(-50%);
  }

  .timer-readout{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:3;
  }
  .time{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:52px;
    color: var(--pit);
    line-height:1;
    letter-spacing:1px;
    font-variant-numeric: tabular-nums;
  }
  .phase-label{
    margin-top:6px;
    font-size:13px;
    font-weight:600;
    color: var(--pit-soft);
    letter-spacing:1.5px;
    text-transform:uppercase;
    opacity:0.75;
  }

  .presets{
    display:flex;
    gap:10px;
  }
  .preset-btn{
    border:1.5px solid var(--peach-2);
    background: rgba(255,255,255,0.5);
    color: var(--pit-soft);
    font-family:'Cairo', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:7px 16px;
    border-radius:999px;
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .preset-btn:hover{ background: var(--peach-1); }
  .preset-btn.selected{
    background: var(--peach-3);
    border-color: var(--peach-deep);
    color: #fff;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:4px;
  }

  .main-btn{
    width:72px;
    height:72px;
    border-radius:50%;
    border:none;
    background: linear-gradient(155deg, var(--peach-2), var(--peach-deep));
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow: 0 10px 22px rgba(229,98,63,0.35);
    transition: transform 0.15s ease;
  }
  .main-btn:active{ transform: scale(0.93); }
  .main-btn svg{ width:26px; height:26px; }

  .side-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1.5px solid var(--peach-2);
    background:#fff;
    color: var(--peach-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .side-btn:hover{ background: var(--cream-2); }
  .side-btn svg{ width:20px; height:20px; }

  .rain-toggle{
    position:relative;
  }
  .rain-toggle.active{
    background: var(--leaf);
    border-color: var(--leaf-dark);
    color:#fff;
  }
  .rain-toggle .vol-ring{
    position:absolute;
    inset:-4px;
    border-radius:50%;
    border:1.5px dashed var(--leaf);
    opacity:0;
    animation: none;
  }
  .rain-toggle.active .vol-ring{
    opacity:0.6;
    animation: pulse-ring 2.4s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{ transform:scale(1); opacity:0.6; }
    100%{ transform:scale(1.35); opacity:0; }
  }

  .hint{
    font-size:12px;
    color: var(--pit-soft);
    opacity:0.6;
    text-align:center;
    max-width:220px;
  }

  @media (prefers-reduced-motion: reduce){
    .rain-toggle .vol-ring{ animation:none !important; }
  }
</style>
</head>
<body>

<canvas id="rain-canvas"></canvas>

<div class="stage">
  <div class="wordmark">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 3C9 6 8 4 6 5C6 5 8 7 8 9C8 9 5 8 4 10C4 10 7 11 8 13" stroke="#6E8F5C" stroke-width="1.8" stroke-linecap="round" fill="#8CAA79"/>
    </svg>
    ola timer
  </div>

  <div class="peach-wrap">
    <svg class="peach-svg" viewBox="0 0 200 200">
      <defs>
        <linearGradient id="peachGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--peach-1)"/>
          <stop offset="55%" stop-color="var(--peach-2)"/>
          <stop offset="100%" stop-color="var(--peach-3)"/>
        </linearGradient>
        <linearGradient id="juiceGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFC79A"/>
          <stop offset="100%" stop-color="var(--peach-deep)"/>
        </linearGradient>
        <clipPath id="peachClip">
          <path d="M100 24
                   C 70 24 48 46 42 78
                   C 34 118 54 168 100 176
                   C 146 168 166 118 158 78
                   C 152 46 130 24 100 24 Z"/>
        </clipPath>
      </defs>

      <path d="M100 24
               C 70 24 48 46 42 78
               C 34 118 54 168 100 176
               C 146 168 166 118 158 78
               C 152 46 130 24 100 24 Z"
            fill="url(#peachGrad)"/>

      <path d="M100 24 C 92 40 92 58 100 72 C 108 58 108 40 100 24 Z"
            fill="var(--peach-deep)" opacity="0.5"/>

      <g clip-path="url(#peachClip)">
        <rect id="juiceFill" class="juice-mask-fill" x="0" y="0" width="200" height="200"
              fill="url(#juiceGrad)" opacity="0.85"
              transform="translate(0,0)"/>
      </g>

      <path class="peach-outline"
            d="M100 24
               C 70 24 48 46 42 78
               C 34 118 54 168 100 176
               C 146 168 166 118 158 78
               C 152 46 130 24 100 24 Z"/>

      <path d="M100 26 C 108 12 122 8 132 12" stroke="var(--leaf)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M104 20 C 112 14 122 15 128 20 C 122 26 112 27 104 20 Z" fill="#8CAA79"/>
    </svg>

    <div class="timer-readout">
      <div class="time" id="timeDisplay">25:00</div>
      <div class="phase-label" id="phaseLabel">تركيز</div>
    </div>
  </div>

  <div class="presets" id="presets">
    <button class="preset-btn selected" data-min="25">25</button>
    <button class="preset-btn" data-min="15">15</button>
    <button class="preset-btn" data-min="5">5</button>
    <button class="preset-btn" data-min="1">1</button>
  </div>

  <div class="controls">
    <button class="side-btn" id="resetBtn" title="إعادة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 4v6h6"/></svg>
    </button>

    <button class="main-btn" id="playBtn" title="ابدأ">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
    </button>

    <button class="side-btn rain-toggle" id="rainBtn" title="صوت المطر">
      <span class="vol-ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 13a4 4 0 0 0-8 0"/><path d="M8 13v3M12 15v4M16 13v2"/><path d="M7 8a5 5 0 0 1 10 0c2 0 4 1.5 4 4"/></svg>
    </button>
  </div>

  <div class="hint">اضغطي على سحابة المطر لتشغيل صوت المطر أثناء العد</div>
</div>

<script>
(function(){
  // ---------- Timer state ----------
  let totalSeconds = 25*60;
  let remaining = totalSeconds;
  let running = false;
  let tickHandle = null;

  const timeDisplay = document.getElementById('timeDisplay');
  const phaseLabel = document.getElementById('phaseLabel');
  const juiceFill = document.getElementById('juiceFill');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const resetBtn = document.getElementById('resetBtn');
  const presets = document.getElementById('presets');
  const rainBtn = document.getElementById('rainBtn');
  const rainCanvas = document.getElementById('rain-canvas');

  function fmt(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const ss = Math.floor(s%60).toString().padStart(2,'0');
    return m+':'+ss;
  }

  function updateJuice(){
    // juice rises as time passes: fraction elapsed
    const elapsedFrac = 1 - (remaining/totalSeconds);
    const h = 200 * elapsedFrac;
    const y = 200 - h;
    juiceFill.setAttribute('y', y);
    juiceFill.setAttribute('height', h);
  }

  function render(){
    timeDisplay.textContent = fmt(remaining);
    updateJuice();
    if(remaining <= 0){
      phaseLabel.textContent = 'خلصت!';
    } else {
      phaseLabel.textContent = running ? 'تركيز' : 'جاهز';
    }
  }

  function setRunning(r){
    running = r;
    playIcon.style.display = r ? 'none' : 'block';
    pauseIcon.style.display = r ? 'block' : 'none';
    render();
  }

  function tick(){
    if(remaining > 0){
      remaining -= 1;
      render();
      if(remaining === 0){
        setRunning(false);
        clearInterval(tickHandle);
        phaseLabel.textContent = 'خلصت!';
      }
    }
  }

  playBtn.addEventListener('click', ()=>{
    if(remaining <= 0){
      remaining = totalSeconds;
    }
    if(!running){
      setRunning(true);
      tickHandle = setInterval(tick, 1000);
    } else {
      setRunning(false);
      clearInterval(tickHandle);
    }
  });

  resetBtn.addEventListener('click', ()=>{
    setRunning(false);
    clearInterval(tickHandle);
    remaining = totalSeconds;
    render();
  });

  presets.addEventListener('click', (e)=>{
    const btn = e.target.closest('.preset-btn');
    if(!btn) return;
    document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    const min = parseInt(btn.dataset.min, 10);
    totalSeconds = min*60;
    remaining = totalSeconds;
    setRunning(false);
    clearInterval(tickHandle);
    render();
  });

  render();

  // ---------- Rain visual (canvas) ----------
  const ctx = rainCanvas.getContext('2d');
  let W, H, drops = [];
  function resize(){
    W = rainCanvas.width = window.innerWidth;
    H = rainCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function makeDrops(n){
    drops = [];
    for(let i=0;i<n;i++){
      drops.push({
        x: Math.random()*W,
        y: Math.random()*H,
        len: 10 + Math.random()*18,
        speed: 4 + Math.random()*6,
        drift: -1 + Math.random()*2,
        opacity: 0.2 + Math.random()*0.35
      });
    }
  }
  makeDrops(120);

  let rainAnimHandle = null;
  function drawRain(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(175,201,206,0.6)';
    ctx.lineWidth = 1.4;
    for(const d of drops){
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.drift*3, d.y + d.len);
      ctx.globalAlpha = d.opacity;
      ctx.strokeStyle = 'rgba(175,201,206,0.75)';
      ctx.stroke();
      d.y += d.speed;
      d.x += d.drift;
      if(d.y > H){
        d.y = -d.len;
        d.x = Math.random()*W;
      }
    }
    ctx.globalAlpha = 1;
    rainAnimHandle = requestAnimationFrame(drawRain);
  }

  // ---------- Rain sound (Web Audio synthesized) ----------
  let audioCtx = null;
  let rainNodes = null;
  let rainOn = false;

  function buildRainSound(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // white noise buffer
    const bufferSize = 2 * audioCtx.sampleRate;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      data[i] = Math.random()*2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;

    const bandpass = audioCtx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = 3500;
    bandpass.Q.value = 0.6;

    const lowpass = audioCtx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = 6000;

    const gain = audioCtx.createGain();
    gain.gain.value = 0;

    noise.connect(bandpass);
    bandpass.connect(lowpass);
    lowpass.connect(gain);
    gain.connect(audioCtx.destination);

    // subtle amplitude wobble for realism
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.15;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.04;
    lfo.connect(lfoGain);
    lfoGain.connect(gain.gain);

    noise.start();
    lfo.start();

    return { noise, gain, lfo };
  }

  function fadeGain(gainNode, target, duration){
    const now = audioCtx.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(target, now + duration);
  }

  rainBtn.addEventListener('click', async ()=>{
    if(!rainOn){
      if(!audioCtx){
        rainNodes = buildRainSound();
      }
      if(audioCtx.state === 'suspended'){
        await audioCtx.resume();
      }
      fadeGain(rainNodes.gain, 0.35, 1.2);
      rainOn = true;
      rainBtn.classList.add('active');
      rainCanvas.classList.add('active');
      if(!rainAnimHandle){ drawRain(); }
    } else {
      fadeGain(rainNodes.gain, 0, 1.0);
      rainOn = false;
      rainBtn.classList.remove('active');
      rainCanvas.classList.remove('active');
    }
  });
})();
</script>
</body>
</html>
