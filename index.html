<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تايمر</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1113">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=JetBrains+Mono:wght@200;400;600&display=swap');

  :root{
    --bg: #0f1113;
    --bg-2: #16191c;
    --ember: #ff7a3d;
    --ember-dim: #7a3d20;
    --paper: #eae6df;
    --paper-dim: #8a8a86;
    --ring-track: #24272a;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    height:100%;
    background: radial-gradient(120% 120% at 50% -10%, #1b1e21 0%, var(--bg) 55%);
    color: var(--paper);
    font-family:'Tajawal', sans-serif;
    overflow:hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    min-height:100vh;
    padding: 28px 20px 34px;
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    opacity:0.9;
  }
  .brand .mark{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:4px;
    color: var(--ember);
    text-transform:uppercase;
  }
  .brand h1{
    font-size:20px;
    font-weight:700;
    color: var(--paper);
  }

  .stage{
    position:relative;
    width:min(78vw, 320px);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  svg.ring{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform: rotate(-90deg);
  }
  .ring-track{
    fill:none;
    stroke: var(--ring-track);
    stroke-width: 10;
  }
  .ring-progress{
    fill:none;
    stroke: var(--ember);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear;
    filter: drop-shadow(0 0 10px rgba(255,122,61,0.55));
  }

  .readout{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .time{
    font-family:'JetBrains Mono', monospace;
    font-weight:200;
    font-size: clamp(40px, 12vw, 58px);
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  .state-label{
    font-size:12px;
    letter-spacing:3px;
    color: var(--paper-dim);
    text-transform:uppercase;
    font-family:'JetBrains Mono', monospace;
    min-height:16px;
  }

  .setter{
    display:flex;
    gap: 22px;
    margin-top: 26px;
  }
  .dial{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .dial button{
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid #2c2f32;
    background: var(--bg-2);
    color: var(--paper);
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: all .15s ease;
  }
  .dial button:active{ transform: scale(0.9); background:#202427; border-color: var(--ember-dim); }
  .dial .val{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color: var(--paper-dim);
    letter-spacing:1px;
  }

  .presets{
    display:flex;
    gap:10px;
    margin-top: 22px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .presets button{
    background: transparent;
    border:1px solid #2c2f32;
    color: var(--paper-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    padding:7px 14px;
    border-radius: 100px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .presets button:active{ border-color: var(--ember); color: var(--ember); }

  .controls{
    display:flex;
    align-items:center;
    gap: 22px;
  }
  .btn-main{
    width:78px; height:78px;
    border-radius:50%;
    border:none;
    background: var(--ember);
    color: #1a0d05;
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow: 0 0 24px rgba(255,122,61,0.35), 0 8px 18px rgba(0,0,0,0.4);
    transition: transform .15s ease;
    font-family:'Tajawal', sans-serif;
  }
  .btn-main:active{ transform: scale(0.94); }
  .btn-main.running{ background:#2a2d30; color: var(--paper); box-shadow:none; border:1px solid #3a3d40; }

  .btn-reset{
    width:52px; height:52px;
    border-radius:50%;
    border:1px solid #2c2f32;
    background: var(--bg-2);
    color: var(--paper-dim);
    font-size:18px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .btn-reset:active{ transform: scale(0.9); border-color: var(--ember-dim); color: var(--ember); }

  .flash{
    animation: flash 0.9s ease-in-out 3;
  }
  @keyframes flash{
    0%,100%{ background: transparent; }
    50%{ background: rgba(255,122,61,0.12); }
  }

  .hidden-num-input{ display:none; }
</style>
</head>
<body id="body">

  <div class="brand">
    <div class="mark">COUNTDOWN</div>
    <h1>تايمر</h1>
  </div>

  <div class="stage">
    <svg class="ring" viewBox="0 0 200 200">
      <circle class="ring-track" cx="100" cy="100" r="90"></circle>
      <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"
              stroke-dasharray="565.48" stroke-dashoffset="0"></circle>
    </svg>
    <div class="readout">
      <div class="time" id="timeDisplay">05:00</div>
      <div class="state-label" id="stateLabel">جاهز</div>
    </div>
  </div>

  <div class="setter" id="setter">
    <div class="dial">
      <button onclick="adjust('m',1)">+</button>
      <div class="val">دقائق</div>
      <button onclick="adjust('m',-1)">−</button>
    </div>
    <div class="dial">
      <button onclick="adjust('s',10)">+</button>
      <div class="val">ثواني</div>
      <button onclick="adjust('s',-10)">−</button>
    </div>
  </div>

  <div class="presets" id="presets">
    <button onclick="setPreset(1)">1 د</button>
    <button onclick="setPreset(5)">5 د</button>
    <button onclick="setPreset(10)">10 د</button>
    <button onclick="setPreset(25)">25 د</button>
  </div>

  <div class="controls">
    <button class="btn-reset" onclick="resetTimer()">↺</button>
    <button class="btn-main" id="mainBtn" onclick="toggleTimer()">ابدأ</button>
    <div style="width:52px"></div>
  </div>

<script>
let totalSeconds = 300;
let remaining = 300;
let running = false;
let intervalId = null;
let audioCtx = null;

const timeDisplay = document.getElementById('timeDisplay');
const stateLabel = document.getElementById('stateLabel');
const mainBtn = document.getElementById('mainBtn');
const ringProgress = document.getElementById('ringProgress');
const CIRC = 565.48;

function format(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return m+":"+sec;
}

function render(){
  timeDisplay.textContent = format(remaining);
  const ratio = totalSeconds > 0 ? remaining/totalSeconds : 0;
  ringProgress.setAttribute('stroke-dashoffset', CIRC * (1-ratio));
}

function adjust(unit, delta){
  if(running) return;
  if(unit==='m'){
    totalSeconds = Math.max(0, totalSeconds + delta*60);
  } else {
    totalSeconds = Math.max(0, totalSeconds + delta);
  }
  remaining = totalSeconds;
  render();
}

function setPreset(minutes){
  if(running) return;
  totalSeconds = minutes*60;
  remaining = totalSeconds;
  render();
}

function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for(let i=0;i<3;i++){
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.value = 0.15;
      o.connect(g); g.connect(audioCtx.destination);
      const start = audioCtx.currentTime + i*0.35;
      o.start(start);
      g.gain.setValueAtTime(0.15, start);
      g.gain.exponentialRampToValueAtTime(0.001, start+0.3);
      o.stop(start+0.32);
    }
  }catch(e){}
}

function toggleTimer(){
  if(remaining <= 0 && !running){
    remaining = totalSeconds;
  }
  if(!running){
    if(remaining <= 0) return;
    running = true;
    mainBtn.textContent = 'إيقاف';
    mainBtn.classList.add('running');
    stateLabel.textContent = 'يعمل...';
    intervalId = setInterval(()=>{
      remaining -= 1;
      if(remaining <= 0){
        remaining = 0;
        render();
        finish();
        return;
      }
      render();
    }, 1000);
  } else {
    pauseTimer();
  }
}

function pauseTimer(){
  running = false;
  clearInterval(intervalId);
  mainBtn.textContent = 'استمرار';
  mainBtn.classList.remove('running');
  stateLabel.textContent = 'متوقف';
}

function resetTimer(){
  running = false;
  clearInterval(intervalId);
  remaining = totalSeconds;
  mainBtn.textContent = 'ابدأ';
  mainBtn.classList.remove('running');
  stateLabel.textContent = 'جاهز';
  document.getElementById('body').classList.remove('flash');
  render();
}

function finish(){
  running = false;
  clearInterval(intervalId);
  mainBtn.textContent = 'ابدأ';
  mainBtn.classList.remove('running');
  stateLabel.textContent = 'انتهى الوقت';
  document.getElementById('body').classList.add('flash');
  beep();
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
